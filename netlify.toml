# Netlify: статика из public/ + serverless-функции из netlify/functions.
# Нужен как альтернатива Vercel: при регистрации Netlify не требует телефона.

[build]
  publish = "public"
  functions = "netlify/functions"

# Приводим адреса функций к тем же /api/*, что и на Vercel —
# тогда фронтенд работает на любой платформе без правок.
[[redirects]]
  from = "/api/check"
  to = "/.netlify/functions/check"
  status = 200

[[redirects]]
  from = "/api/batch"
  to = "/.netlify/functions/batch"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
